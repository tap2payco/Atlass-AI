[package]
name = "runtime-agent"
version = "0.1.0"
edition = "2021"
description = "Atlas Agent Runtime — an operation state machine that runs model/tool turns over a persisted conversation"

[dependencies]
shared      = { path = "../shared" }
sdk         = { path = "../sdk" }
async-trait = "0.1"
tokio       = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util  = "0.7"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "1.0"
uuid        = "1.10"
tracing     = "0.1"
capability-registry = { path = "../capability-registry" }
platform-contracts  = { path = "../platform-contracts" }
runtime-memory      = { path = "../runtime-memory" }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
