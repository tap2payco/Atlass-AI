[package]
name = "runtime-repository"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
sdk = { path = "../sdk" }
ignore = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-go = "0.19"
notify = "6.1"

[dev-dependencies]
criterion = "0.5"
walkdir = "2.3"

[[bench]]
name = "discovery_bench"
harness = false
