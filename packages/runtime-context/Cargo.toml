[package]
name = "runtime-context"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
shared = { path = "../shared" }
sdk = { path = "../sdk" }
execution-core = { path = "../execution-core" }
platform-contracts = { path = "../platform-contracts" }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
