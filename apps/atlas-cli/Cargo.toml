[package]
name = "atlas-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
platform-contracts = { path = "../../packages/platform-contracts" }
runtime-kernel = { path = "../../packages/runtime-kernel" }
runtime-context = { path = "../../packages/runtime-context" }
runtime-memory = { path = "../../packages/runtime-memory" }
runtime-knowledge = { path = "../../packages/runtime-knowledge" }
runtime-model = { path = "../../packages/runtime-model" }
runtime-agent = { path = "../../packages/runtime-agent" }
shared = { path = "../../packages/shared" }
tokio-util = "0.7"
tracing = "0.1"
runtime-repository = { path = "../../packages/runtime-repository" }
execution-core = { path = "../../packages/execution-core" }
sdk = { path = "../../packages/sdk" }

# Job Objects and restricted tokens for run_command.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Process groups: kill a command's whole process group (run_command).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
